# Keeps dependencies current so CVE fixes arrive as routine PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/go"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directories:
      - "/csharp/Octopus"
      - "/csharp/Octopus/Octopus.Kubernetes.Monitor.MessageContracts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns:
          - "*"
